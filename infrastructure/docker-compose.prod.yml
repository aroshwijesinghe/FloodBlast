# FloodBlast — Production Docker Compose
# Includes all app services + data layer with secure port bindings.
# Data services (postgres, redis, minio) do NOT bind to host ports.
# Only the Nginx gateway (80/443) is publicly reachable.

services:

  # ─── PostgreSQL + PostGIS ──────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: floodblast-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-floodblast}
      POSTGRES_USER: ${POSTGRES_USER:-floodblast_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}        # required — no default
    # ✅ No ports: binding — only internal Docker network access
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./seed-data/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-floodblast_user} -d ${POSTGRES_DB:-floodblast}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: floodblast-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    # ✅ No ports: binding — only internal Docker network access
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO (S3-compatible Object Storage) ─────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: floodblast-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    # ✅ No ports: binding — accessed internally by server and via Nginx proxy
    expose:
      - "9000"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── NestJS Backend Server ────────────────────────────────────────────────
  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    container_name: floodblast-server
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
    # ✅ Not exposed to host — Nginx is the only public entry point
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─── Python AI / NLP Service ──────────────────────────────────────────────
  ai-service:
    build:
      context: ../apps/ai-service
      dockerfile: Dockerfile
    container_name: floodblast-ai
    restart: unless-stopped
    env_file:
      - ../apps/ai-service/.env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    expose:
      - "8001"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── React Web Dashboard (Nginx static server) ────────────────────────────
  web-dashboard:
    build:
      context: ../apps/web-dashboard
      dockerfile: Dockerfile
    container_name: floodblast-web
    restart: unless-stopped
    # ✅ Only the web dashboard is publicly accessible (via gateway below)
    expose:
      - "80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - backend
      - frontend

  # ─── Nginx Gateway (sole public-facing entry point) ───────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: floodblast-gateway
    restart: unless-stopped
    ports:
      - "80:80"      # HTTP (redirect to HTTPS in production)
      - "443:443"    # HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro  # TLS certificates (Let's Encrypt)
    depends_on:
      - web-dashboard
      - server
    networks:
      - frontend
      - backend

networks:
  backend:
    driver: bridge
    internal: false   # server needs outbound internet for FCM/SMS
  frontend:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
