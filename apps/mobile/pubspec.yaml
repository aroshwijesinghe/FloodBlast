name: flood_blast
description: FloodBlast disaster management platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  go_router: ^12.1.1
  google_maps_flutter: ^2.5.0
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.18
  dio: ^5.3.3
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  image_picker: ^1.0.4
  image_cropper: ^5.0.0
  permission_handler: ^11.0.1
  connectivity_plus: ^5.0.1
  shared_preferences: ^2.2.2
  uuid: ^4.2.0
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  get_it: ^7.6.4
  injectable: ^2.3.2
  url_launcher: ^6.2.1
  flutter_local_notifications: ^16.1.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  record: ^5.0.5
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  json_serializable: ^8.0.0
  freezed: ^2.4.5
  drift_dev: ^2.14.0
  injectable_generator: ^2.4.1
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
